# Full stack: a 5-node DFS cluster + the Streamlit dashboard.
#
#   docker compose up --build
#
# Then open the dashboard at http://localhost:8501
# Nodes are also reachable from the host at http://localhost:8001 .. :8005
#
# All nodes run the SAME image (built once from ./Dockerfile); identity comes
# from NODE_ID / PORT, and peers are discovered by service name via CLUSTER_NODES.

# Shared peer map — every node and the UI address peers by Docker service name.
x-cluster-nodes: &cluster_nodes "node1=http://node1:8001,node2=http://node2:8002,node3=http://node3:8003,node4=http://node4:8004,node5=http://node5:8005"

# Common node settings (build once, reuse the image; identical healthcheck).
# The healthcheck is deliberately snappy so nodes are marked healthy within a few
# seconds and the UI (which waits on them) starts promptly.
x-node: &node-defaults
  build: .
  image: dfs-node:latest
  restart: unless-stopped
  networks: [dfsnet]
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${PORT}/health || exit 1"]
    interval: 2s
    timeout: 2s
    retries: 15
    start_period: 5s

services:
  node1:
    <<: *node-defaults
    container_name: dfs-node1
    environment:
      NODE_ID: node1
      PORT: "8001"
      CLUSTER_NODES: *cluster_nodes
    ports: ["8001:8001"]
    volumes: ["node1-data:/app/data"]

  node2:
    <<: *node-defaults
    container_name: dfs-node2
    environment:
      NODE_ID: node2
      PORT: "8002"
      CLUSTER_NODES: *cluster_nodes
    ports: ["8002:8002"]
    volumes: ["node2-data:/app/data"]

  node3:
    <<: *node-defaults
    container_name: dfs-node3
    environment:
      NODE_ID: node3
      PORT: "8003"
      CLUSTER_NODES: *cluster_nodes
    ports: ["8003:8003"]
    volumes: ["node3-data:/app/data"]

  node4:
    <<: *node-defaults
    container_name: dfs-node4
    environment:
      NODE_ID: node4
      PORT: "8004"
      CLUSTER_NODES: *cluster_nodes
    ports: ["8004:8004"]
    volumes: ["node4-data:/app/data"]

  node5:
    <<: *node-defaults
    container_name: dfs-node5
    environment:
      NODE_ID: node5
      PORT: "8005"
      CLUSTER_NODES: *cluster_nodes
    ports: ["8005:8005"]
    volumes: ["node5-data:/app/data"]

  ui:
    build: ./ui
    image: dfs-ui:latest
    container_name: dfs-ui
    environment:
      DFS_NODES: "http://node1:8001,http://node2:8002,http://node3:8003,http://node4:8004,http://node5:8005"
    ports: ["8501:8501"]
    networks: [dfsnet]
    depends_on:
      node1: {condition: service_healthy}
      node2: {condition: service_healthy}
      node3: {condition: service_healthy}
      node4: {condition: service_healthy}
      node5: {condition: service_healthy}

networks:
  dfsnet:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:

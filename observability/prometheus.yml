# Prometheus scrape config for the DFS cluster.
# Reaches each node by its Docker service name on the shared network.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: dfs-nodes
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - node1:8001
          - node2:8002
          - node3:8003
          - node4:8004
          - node5:8005
